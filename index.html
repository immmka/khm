<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Моя карта клиентов — Москва</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; height: 100vh; }
    #sidebar {
      width: 360px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header h1 { font-size: 17px; font-weight: 600; }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .filters {
      padding: 10px 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .filter-btn.green.active { background: var(--green); border-color: var(--green); }
    .filter-btn.red.active { background: var(--red); border-color: var(--red); }
    .filter-btn.yellow.active { background: var(--yellow); border-color: var(--yellow); color: #000; }
    .stats {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
    }
    #places-list { flex: 1; overflow-y: auto; padding: 8px; }
    .place-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      margin-bottom: 7px;
      cursor: pointer;
    }
    .place-item:hover { border-color: var(--accent); }
    .place-item .name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.working { background: var(--green); }
    .status-dot.not { background: var(--red); }
    .status-dot.potential { background: var(--yellow); }
    .status-dot.other { background: var(--blue); }
    .place-item .meta { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .sidebar-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #map { flex: 1; height: 100%; }
    .mobile-toggle {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1001;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 100%;
        max-width: 340px;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      #sidebar.open { transform: translateX(0); }
      .mobile-toggle { display: flex; align-items: center; justify-content: center; }
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal h2 { font-size: 17px; margin-bottom: 14px; }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
    }
    .form-group textarea { min-height: 70px; resize: vertical; }
    .status-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .status-option {
      flex: 1;
      min-width: 80px;
      padding: 9px 6px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      font-size: 12px;
    }
    .status-option.selected.working { border-color: var(--green); background: rgba(34,197,94,0.15); }
    .status-option.selected.not { border-color: var(--red); background: rgba(239,68,68,0.15); }
    .status-option.selected.potential { border-color: var(--yellow); background: rgba(234,179,8,0.15); }
    .status-option.selected.other { border-color: var(--blue); background: rgba(59,130,246,0.15); }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .modal-actions .btn { flex: 1; }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .loading {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 14px;
    }
    .no-coords { opacity: 0.55; }
  </style>
</head>
<body>
  <button class="mobile-toggle" id="toggleSidebar">☰</button>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>Моя карта</h1>
        <button class="btn btn-sm" id="refreshBtn">Обновить</button>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn green" data-filter="working">Работаю</button>
        <button class="filter-btn red" data-filter="not">Не работаю</button>
        <button class="filter-btn yellow" data-filter="potential">Потенциал</button>
      </div>
      <div class="stats" id="stats">Загрузка...</div>
      <div id="places-list">
        <div class="loading">Загружаю данные из Google Таблицы...</div>
      </div>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-sm" id="exportBtn">Экспорт</button>
      </div>
    </aside>
    <div id="map"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modalTitle">Заведение</h2>
      <div class="form-group">
        <label>Название заведения</label>
        <input type="text" id="f-name" readonly />
      </div>
      <div class="form-group">
        <label>ООО / Компания</label>
        <input type="text" id="f-company" readonly />
      </div>
      <div class="form-group">
        <label>Менеджер</label>
        <input type="text" id="f-manager" readonly />
      </div>
      <div class="form-group">
        <label>Статус</label>
        <div class="status-options">
          <button type="button" class="status-option working" data-status="working">Работаю</button>
          <button type="button" class="status-option not" data-status="not">Не работаю</button>
          <button type="button" class="status-option potential" data-status="potential">Потенциал</button>
          <button type="button" class="status-option other" data-status="other">Другое</button>
        </div>
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="text" id="f-phone" readonly />
      </div>
      <div class="form-group">
        <label>Заметки</label>
        <textarea id="f-notes" readonly></textarea>
      </div>
      <div class="hint" id="coordHint"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeBtn">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/11nvKladxDSIc1zqJtOQ0_M-KD_su-bR2a1bBQfsN894/export?format=csv&gid=0';

    const iconUrls = {
      working: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      not: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      potential: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
      other: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png'
    };
    const shadowUrl = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png';

    function makeIcon(status) {
      return L.icon({
        iconUrl: iconUrls[status] || iconUrls.other,
        shadowUrl: shadowUrl,
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    let places = [];
    let markers = {};
    let currentFilter = 'all';

    const map = L.map('map').setView([55.7558, 37.6173], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function statusLabel(s) {
      const m = { working: 'Работаю', not: 'Не работаю', potential: 'Потенциал', other: 'Другое' };
      return m[s] || s || '—';
    }

    function normalizeStatus(raw) {
      if (!raw) return 'potential';
      const s = String(raw).toLowerCase().trim();
      if (['working', 'работаю', 'work', 'да'].includes(s)) return 'working';
      if (['not', 'не работаю', 'no', 'нет'].includes(s)) return 'not';
      if (['potential', 'потенциал', 'возможно'].includes(s)) return 'potential';
      return 'other';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current);
      return result;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = (values[idx] || '').trim(); });
        result.push(obj);
      }
      return result;
    }

    function loadFromSheet() {
      document.getElementById('places-list').innerHTML = '<div class="loading">Загружаю данные из Google Таблицы...</div>';
      document.getElementById('stats').textContent = 'Загрузка...';

      fetch(SHEET_CSV + '&_=' + Date.now())
        .then(r => r.text())
        .then(text => {
          const rows = parseCSV(text);
          places = rows.map((row, idx) => {
            const name = row['название заведения'] || row['название'] || '';
            const company = row['ооо'] || '';
            const manager = row['менеджер'] || '';
            const status = normalizeStatus(row['status'] || row['статус']);
            const phone = row['phone'] || row['телефон'] || '';
            const notes = row['notes'] || row['заметки'] || '';
            const lat = parseFloat(row['lat'] || row['широта']);
            const lng = parseFloat(row['lng'] || row['lon'] || row['долгота']);
            return {
              id: row['id'] || String(idx + 1),
              name: name || company || 'Без названия',
              company,
              manager,
              status,
              phone,
              notes,
              lat: isNaN(lat) ? null : lat,
              lng: isNaN(lng) ? null : lng
            };
          }).filter(p => p.name && p.name !== 'Без названия');

          refreshMarkers();
          renderList();
          updateStats();
        })
        .catch(err => {
          document.getElementById('places-list').innerHTML =
            '<div class="empty-state">Ошибка загрузки таблицы.<br>' + escapeHtml(err.message) + '<br><br>Проверьте доступ «Все, у кого есть ссылка».</div>';
          document.getElementById('stats').textContent = 'Ошибка';
        });
    }

    function updateStats() {
      const total = places.length;
      const withCoords = places.filter(p => p.lat && p.lng).length;
      const working = places.filter(p => p.status === 'working').length;
      const notW = places.filter(p => p.status === 'not').length;
      const potential = places.filter(p => p.status === 'potential').length;
      document.getElementById('stats').textContent =
        'Всего: ' + total + ' · На карте: ' + withCoords + ' · Работаю: ' + working + ' · Не работаю: ' + notW + ' · Потенциал: ' + potential;
    }

    function renderList() {
      const list = document.getElementById('places-list');
      const filtered = currentFilter === 'all' ? places : places.filter(p => p.status === currentFilter);

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state">' + (places.length === 0 ? 'В таблице пока нет заведений.' : 'Нет заведений с этим статусом.') + '</div>';
        return;
      }

      list.innerHTML = filtered.map(p => {
        return '<div class="place-item ' + ((!p.lat || !p.lng) ? 'no-coords' : '') + '" data-id="' + p.id + '">' +
          '<div class="name"><span class="status-dot ' + p.status + '"></span>' + escapeHtml(p.name) + '</div>' +
          '<div class="meta">' +
            (p.company ? escapeHtml(p.company) + '<br>' : '') +
            (p.manager ? 'Менеджер: ' + escapeHtml(p.manager) : '') +
            ((!p.lat || !p.lng) ? '<br><span style="color:#f59e0b">Нет координат</span>' : '') +
          '</div></div>';
      }).join('');

      list.querySelectorAll('.place-item').forEach(el => {
        el.addEventListener('click', () => {
          const place = places.find(p => p.id === el.dataset.id);
          if (place) {
            if (place.lat && place.lng) map.setView([place.lat, place.lng], 16);
            openModal(place);
          }
        });
      });
    }

    function addMarkerToMap(place) {
      if (!place.lat || !place.lng) return;
      if (markers[place.id]) map.removeLayer(markers[place.id]);
      const marker = L.marker([place.lat, place.lng], { icon: makeIcon(place.status) })
        .addTo(map)
        .bindPopup('<b>' + escapeHtml(place.name) + '</b><br>' + statusLabel(place.status) + (place.manager ? '<br>' + escapeHtml(place.manager) : ''));
      marker.on('click', () => openModal(place));
      markers[place.id] = marker;
    }

    function refreshMarkers() {
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};
      places.forEach(addMarkerToMap);
    }

    function openModal(place) {
      document.getElementById('modalTitle').textContent = place.name || 'Заведение';
      document.getElementById('f-name').value = place.name || '';
      document.getElementById('f-company').value = place.company || '';
      document.getElementById('f-manager').value = place.manager || '';
      document.getElementById('f-phone').value = place.phone || '';
      document.getElementById('f-notes').value = place.notes || '';
      document.querySelectorAll('.status-option').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.status === place.status);
      });
      if (place.lat && place.lng) {
        document.getElementById('coordHint').textContent = 'Координаты: ' + place.lat.toFixed(5) + ', ' + place.lng.toFixed(5);
      } else {
        document.getElementById('coordHint').textContent = 'Координаты ещё не указаны. Добавьте lat и lng в таблице.';
      }
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    document.getElementById('closeBtn').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    document.getElementById('refreshBtn').addEventListener('click', loadFromSheet);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
      });
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = JSON.stringify(places, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'places-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('toggleSidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    loadFromSheet();
  </script>
</body>
</html>
