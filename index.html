<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Моя карта клиентов — Москва</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #f1f5f9;
      --muted: #94a3b8; --accent: #3b82f6; --green: #22c55e; --red: #ef4444; --yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    #app { display: flex; height: 100vh; }
    #sidebar { width: 360px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h1 { font-size: 17px; font-weight: 600; }
    .btn { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .filters { padding: 10px 16px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .filter-btn { padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .filter-btn.green.active { background: var(--green); border-color: var(--green); }
    .filter-btn.red.active { background: var(--red); border-color: var(--red); }
    .filter-btn.yellow.active { background: var(--yellow); border-color: var(--yellow); color: #000; }
    .stats { font-size: 12px; color: var(--muted); padding: 8px 16px; border-bottom: 1px solid var(--border); }
    #places-list { flex: 1; overflow-y: auto; padding: 8px; }
    .place-item { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 11px; margin-bottom: 7px; cursor: pointer; }
    .place-item:hover { border-color: var(--accent); }
    .place-item .name { font-weight: 600; font-size: 14px; margin-bottom: 3px; display: flex; align-items: center; gap: 7px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; }
    .status-dot.working { background: var(--green); }
    .status-dot.not { background: var(--red); }
    .status-dot.potential { background: var(--yellow); }
    .status-dot.other { background: var(--accent); }
    .place-item .meta { font-size: 12px; color: var(--muted); line-height: 1.4; }
    #map { flex: 1; height: 100%; }
    .mobile-toggle { display: none; position: absolute; top: 12px; left: 12px; z-index: 1001; background: var(--panel); border: 1px solid var(--border); color: var(--text); width: 42px; height: 42px; border-radius: 10px; font-size: 18px; }
    @media (max-width: 768px) {
      #sidebar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; max-width: 340px; transform: translateX(-100%); transition: transform 0.25s; }
      #sidebar.open { transform: translateX(0); }
      .mobile-toggle { display: flex; align-items: center; justify-content: center; }
    }
    .loading { text-align: center; padding: 30px; color: var(--muted); }
  </style>
</head>
<body>
  <button class="mobile-toggle" id="toggleSidebar">☰</button>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>Моя карта</h1>
        <button class="btn" id="refreshBtn">Обновить</button>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn green" data-filter="working">Работаю</button>
        <button class="filter-btn red" data-filter="not">Не работаю</button>
        <button class="filter-btn yellow" data-filter="potential">Потенциал</button>
      </div>
      <div class="stats" id="stats">Загрузка...</div>
      <div id="places-list"><div class="loading">Загружаю данные...</div></div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/11nvKladxDSIc1zqJtOQ0_M-KD_su-bR2a1bBQfsN894/export?format=csv&gid=0';

    const iconUrls = {
      working: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      not: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      potential: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
      other: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png'
    };
    const shadowUrl = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png';

    function makeIcon(status) {
      return L.icon({ iconUrl: iconUrls[status] || iconUrls.other, shadowUrl, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });
    }

    let places = [], markers = {}, currentFilter = 'all';
    const map = L.map('map').setView([55.7558, 37.6173], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

    function parseNum(val) {
      if (!val) return null;
      const n = parseFloat(String(val).replace(',', '.'));
      return isNaN(n) ? null : n;
    }

    function normalizeStatus(raw) {
      if (!raw) return 'potential';
      const s = String(raw).toLowerCase().trim();
      if (['working', 'работаю', 'work', 'да'].includes(s)) return 'working';
      if (['not', 'не работаю', 'no', 'нет'].includes(s)) return 'not';
      if (['potential', 'потенциал', 'возможно'].includes(s)) return 'potential';
      return 'other';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '', inQuotes = false;
      for (let char of line) {
        if (char === '"') inQuotes = !inQuotes;
        else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += char;
      }
      result.push(current);
      return result;
    }

    function loadFromSheet() {
      document.getElementById('places-list').innerHTML = '<div class="loading">Загружаю...</div>';
      fetch(SHEET_CSV + '&_=' + Date.now())
        .then(r => r.text())
        .then(text => {
          const lines = text.trim().split(/\r?\n/);
          const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
          places = [];
          for (let i = 1; i < lines.length; i++) {
            const vals = parseCSVLine(lines[i]);
            const row = {};
            headers.forEach((h, idx) => row[h] = (vals[idx] || '').trim());
            const name = row['название заведения'] || row['название'] || '';
            if (!name) continue;
            places.push({
              id: row['id'] || String(i),
              name,
              company: row['ооо'] || '',
              manager: row['менеджер'] || '',
              status: normalizeStatus(row['status'] || row['статус']),
              phone: row['phone'] || '',
              notes: row['notes'] || '',
              lat: parseNum(row['lat'] || row['широта']),
              lng: parseNum(row['lng'] || row['долгота']),
              address: row['address'] || row['адрес'] || ''
            });
          }
          refreshMarkers();
          renderList();
          updateStats();
        })
        .catch(() => {
          document.getElementById('places-list').innerHTML = '<div class="loading">Ошибка загрузки</div>';
        });
    }

    function updateStats() {
      const total = places.length;
      const withCoords = places.filter(p => p.lat && p.lng).length;
      const w = places.filter(p => p.status === 'working').length;
      const n = places.filter(p => p.status === 'not').length;
      const p = places.filter(p => p.status === 'potential').length;
      document.getElementById('stats').textContent = `Всего: ${total} · На карте: ${withCoords} · Работаю: ${w} · Не работаю: ${n} · Потенциал: ${p}`;
    }

    function renderList() {
      const list = document.getElementById('places-list');
      const filtered = currentFilter === 'all' ? places : places.filter(p => p.status === currentFilter);
      if (!filtered.length) {
        list.innerHTML = '<div class="loading">Нет заведений</div>';
        return;
      }
      list.innerHTML = filtered.map(p => `
        <div class="place-item" data-id="${p.id}">
          <div class="name"><span class="status-dot ${p.status}"></span>${escapeHtml(p.name)}</div>
          <div class="meta">${p.company ? escapeHtml(p.company) + '<br>' : ''}${p.manager ? 'Менеджер: ' + escapeHtml(p.manager) : ''}${p.address ? '<br>' + escapeHtml(p.address) : ''}</div>
        </div>
      `).join('');
      list.querySelectorAll('.place-item').forEach(el => {
        el.addEventListener('click', () => {
          const place = places.find(x => x.id === el.dataset.id);
          if (place && place.lat && place.lng) map.setView([place.lat, place.lng], 16);
        });
      });
    }

    function refreshMarkers() {
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};
      places.forEach(p => {
        if (!p.lat || !p.lng) return;
        const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.status) })
          .addTo(map)
          .bindPopup(`<b>${escapeHtml(p.name)}</b><br>${p.status}<br>${escapeHtml(p.manager || '')}`);
        markers[p.id] = marker;
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', loadFromSheet);
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderList();
      });
    });
    document.getElementById('toggleSidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    loadFromSheet();
  </script>
</body>
</html>
