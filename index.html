<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Моя карта клиентов — Москва</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#f1f5f9; --muted:#94a3b8; --accent:#3b82f6; --green:#22c55e; --red:#ef4444; --yellow:#eab308; }
    *{box-sizing:border-box;margin:0;padding:0}
    body.light { --bg:#f8fafc; --panel:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; }
    body.sepia { --bg:#1c1917; --panel:#292524; --border:#44403c; --text:#fafaf9; --muted:#a8a29e; --accent:#d97706; }
    body.dim { --bg:#0c1222; --panel:#1a2332; --border:#2d3a4f; --text:#e2e8f0; --muted:#94a3b8; }
    #app{display:flex;height:100vh}
    #sidebar{width:380px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:1000;position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s}
    #sidebar.open{transform:translateX(0)}
    .mobile-toggle{display:flex;align-items:center;justify-content:center;position:absolute;top:12px;left:12px;z-index:1001;background:var(--panel);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:10px;font-size:18px}
    .btn{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
    .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
    .filters,.cat-filters{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
    .filter-btn{padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
    .filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .filter-btn.green.active{background:var(--green);border-color:var(--green)}
    .filter-btn.red.active{background:var(--red);border-color:var(--red)}
    .filter-btn.yellow.active{background:var(--yellow);border-color:var(--yellow);color:#000}
    .stats{font-size:12px;color:var(--muted);padding:8px 16px;border-bottom:1px solid var(--border)}
    #places-list{flex:1;overflow-y:auto;padding:8px}
    .place-item{background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px;cursor:pointer}
    .place-item:hover{border-color:var(--accent)}
    .place-item .name{font-weight:600;font-size:14px;margin-bottom:3px;display:flex;align-items:center;gap:7px}
    .status-dot{width:9px;height:9px;border-radius:50%}
    .status-dot.working{background:var(--green)}
    .status-dot.not{background:var(--red)}
    .status-dot.potential{background:var(--yellow)}
    .status-dot.unknown{background:#9ca3af}
    .place-item .meta{font-size:12px;color:var(--muted);line-height:1.4}
    #map{flex:1;height:100%;min-height:400px;background:#1e293b}
    .mobile-toggle{display:flex;align-items:center;justify-content:center;position:absolute;top:12px;left:12px;z-index:1001;background:var(--panel);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:10px;font-size:18px}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
    .modal-overlay.show{display:flex}
    .modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:420px;padding:20px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
    .form-group input,.form-group select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:#0f172a;color:var(--text);font-size:14px}
    .modal-actions{display:flex;gap:8px;margin-top:16px}
    .modal-actions .btn{flex:1}
  </style>
</head>
<body>
  <button class="mobile-toggle" id="toggleSidebar">☰</button>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>Моя карта</h1>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary" id="filtersBtn">Фильтры</button>
          <button class="btn" id="addBtn">+ Добавить</button>
        </div>
      </div>
      <div id="filtersPanel" style="display:none;border-bottom:1px solid var(--border)">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">Все</button>
          <button class="filter-btn green" data-filter="working">Работаю</button>
          <button class="filter-btn red" data-filter="not">Не работаю</button>
          <button class="filter-btn yellow" data-filter="potential">Потенциал</button>
          <button class="filter-btn" data-filter="unknown" style="background:#9ca3af;color:#fff">Неизвестно</button>
        </div>
        <div class="cat-filters" id="catFilters">
          <button class="filter-btn active" data-cat="all">Все</button>
          <button class="filter-btn" data-cat="Ресторан">Ресторан</button>
          <button class="filter-btn" data-cat="Бар">Бар</button>
          <button class="filter-btn" data-cat="Клуб">Клуб</button>
          <button class="filter-btn" data-cat="Лаундж">Лаундж</button>
        </div>
        <div class="filters">
          <input id="searchInput" placeholder="Поиск по названию или адресу..." style="flex:1;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);min-width:140px">
          <select id="managerFilter" style="padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted)">
            <option value="all">Все менеджеры</option>
          </select>
        </div>
        <div class="filters">
          <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="filterPhone"> Только с телефоном</label>
          <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="filterNotes"> Только с заметками</label>
          <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="filterOld"> Не обновлялись 30+ дней</label>
          <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="toggleCluster" checked> Кластеры</label>
        </div>
        <div class="filters">
          <button class="filter-btn" id="exportBtn">Экспорт CSV</button>
          <button class="filter-btn" id="exportKmlBtn">Экспорт KML</button>
          <button class="filter-btn" id="themeBtn">Тема</button>
        </div>
      </div>
      <div class="stats" id="stats">Загрузка...</div>
      <div id="places-list"></div>
    </aside>
    <div id="map"></div>
  </div>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2 style="margin-bottom:14px">Добавить заведение</h2>
      <div class="form-group"><label>Название</label><input id="add-name"></div>
      <div class="form-group"><label>ООО / Фирма</label><input id="add-company"></div>
      <div class="form-group"><label>Адрес</label><input id="add-address" placeholder="ул. Пятницкая, 24"></div>
      <div class="form-group">
        <label>Менеджер</label>
        <select id="add-manager">
          <option value="">— не выбран —</option>
          <option>Дима б</option>
          <option>Лера</option>
          <option>Алина</option>
          <option>Дима ч</option>
          <option>Антон</option>
          <option>Артур</option>
          <option>Александр</option>
        </select>
      </div>
      <div class="form-group"><label>Номер телефона</label><input id="add-phone" placeholder="+7..."></div>
      <div class="form-group"><label>Заметки</label><textarea id="add-notes" rows="2" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;color:#fff"></textarea></div>
      <div class="form-group">
        <label>Категория</label>
        <select id="add-category">
          <option>Ресторан</option><option>Бар</option><option>Клуб</option><option>Лаундж</option>
        </select>
      </div>
      <div class="form-group">
        <label>Статус</label>
        <select id="add-status">
          <option value="unknown">Неизвестно</option>
          <option value="potential">Потенциал</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelAdd">Отмена</button>
        <button class="btn" id="saveAdd">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="statusModal">
    <div class="modal">
      <h2 style="margin-bottom:14px" id="statusTitle">Сменить статус</h2>
      <div class="form-group">
        <label>Новый статус</label>
        <select id="new-status">
          <option value="working">Работаю</option>
          <option value="not">Не работаю</option>
          <option value="potential">Потенциал</option>
          <option value="unknown">Неизвестно</option>
        </select>
      </div>
      <div class="form-group"><label>Менеджер</label><input id="edit-manager"></div>
      <div class="form-group"><label>Телефон</label><input id="edit-phone"></div>
      <div class="form-group"><label>Заметки</label><textarea id="edit-notes" rows="2" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;color:#fff"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelStatus">Отмена</button>
        <button class="btn" id="saveStatus">Сохранить</button>
        <button class="btn" style="background:#ef4444" id="deleteBtn">Удалить</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      console.error('Map error:', e.message, e.filename, e.lineno);
    });

    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRotgX74WgwpLeW2F7KZkjxnhn2w5Jd5_IGKh_HRK3k0fVgmzn1zMRjXQirqMUWqUqSORxXY3ig63p/pub?gid=1877556216&single=true&output=csv';
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOQsUOyedD-u7szCUr6Z925mnYV4KKOLNq0rvN9IyO54DMz42VvpBw7KWZYKtO2jLk/exec';
    // Данные теперь загружаются из Apps Script (все листы)
    const DATA_URL = SCRIPT_URL + '?action=list';

    const iconUrls = {
      working: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      not: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      potential: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png'
    };
    const shadowUrl = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png';

    const MANAGERS = ['Дима б', 'Лера', 'Алина', 'Дима ч', 'Антон', 'Артур', 'Александр'];
    const managerColors = {};
    const colorPalette = ['#3b82f6','#8b5cf6','#06b6d4','#f97316','#ec4899','#14b8a6','#a855f7','#0ea5e9','#d946ef','#84cc16'];
    MANAGERS.forEach((m, i) => { managerColors[m] = colorPalette[i % colorPalette.length]; });
    function getManagerColor(manager) {
      if (!manager) return '#3b82f6';
      if (!managerColors[manager]) {
        const idx = Object.keys(managerColors).length % colorPalette.length;
        managerColors[manager] = colorPalette[idx];
      }
      return managerColors[manager];
    }
    function makeIcon(status, manager) {
      let color = iconUrls.potential;
      if (status === 'working') {
        // custom colored marker via CSS isn't easy with default icons, use blue as base and we'll rely on popup
        color = iconUrls.working;
      } else if (status === 'not') {
        color = iconUrls.not;
      }
      return L.icon({iconUrl: color, shadowUrl, iconSize:[25,41], iconAnchor:[12,41], popupAnchor:[1,-34], shadowSize:[41,41]});
    }

    let places=[], currentFilter='all', currentCat='all', currentManager='all', currentSearch='', 
        filterPhone=false, filterNotes=false, filterOld=false, clustersOn=true, currentPlace=null;
    const map = L.map('map').setView([55.7558,37.6173],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    const markerCluster = L.markerClusterGroup({
      maxClusterRadius: 50,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false
    });
    map.addLayer(markerCluster);

    function parseNum(v){if(!v)return null;const n=parseFloat(String(v).replace(',','.').replace(/\s/g,''));return isNaN(n)?null:n}
    function normalizeStatus(r){
      if(!r)return'unknown';
      const s=String(r).toLowerCase();
      if(['working','работаю','да'].includes(s))return'working';
      if(['not','не работаю','нет'].includes(s))return'not';
      if(['potential','потенциал'].includes(s))return'potential';
      if(['unknown','неизвестно','не известно'].includes(s))return'unknown';
      return'unknown';
    }
    function escapeHtml(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}
    function parseCSVLine(line){const r=[];let c='',q=false;for(let ch of line){if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c);c='';}else c+=ch}r.push(c);return r}

    function loadFromSheet(){
      fetch(DATA_URL+'&_='+Date.now())
        .then(r=>{
          if(!r.ok) throw new Error('HTTP '+r.status);
          return r.json();
        })
        .then(data=>{
          if(!Array.isArray(data)) throw new Error('Not an array');
          places=[];
          data.forEach((row,i)=>{
            const name=String(row['Название заведения']||row['название']||row['Название']||row['name']||'').trim();
            if(!name)return;
            const lat=parseNum(row['lat']||row['широта']||row['Lat']);
            const lng=parseNum(row['lng']||row['долгота']||row['Lng']);
            places.push({
              id:row['id']||String(i),name,
              company:row['ООО']||row['ооо']||'',
              manager:row['Менеджер']||row['менеджер']||'',
              category:row['Категория']||row['категория']||row['category']||'',
              status:normalizeStatus(row['Status']||row['status']||row['статус']),
              lat,lng,
              address:row['address']||row['адрес']||row['Address']||row['Адрес']||'',
              phone:row['Phone']||row['phone']||row['телефон']||row['номер']||'',
              notes:row['Notes']||row['notes']||row['заметки']||''
            });
          });
          refreshMarkers();renderList();updateStats();
          // Обновить список менеджеров и легенду
          const managers=[...new Set(places.map(p=>p.manager).filter(Boolean))];
          const sel=document.getElementById('managerFilter');
          const cur=sel.value;
          sel.innerHTML='<option value="all">Все менеджеры</option>'+managers.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
          sel.value=cur||'all';
          let legend = document.getElementById('managerLegend');
          if (!legend) {
            legend = document.createElement('div');
            legend.id = 'managerLegend';
            legend.style.cssText = 'padding:8px 16px;font-size:11px;color:var(--muted)';
            document.getElementById('filtersPanel').appendChild(legend);
          }
          legend.innerHTML = '<b>Цвета менеджеров (работаю):</b><br>' + managers.map(m => 
            `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${getManagerColor(m)};margin-right:4px"></span>${escapeHtml(m)}`
          ).join(' &nbsp; ');
        })
        .catch(e=>{
          console.error('Load error:', e);
          document.getElementById('stats').textContent = 'Ошибка загрузки данных. Проверьте Apps Script.';
        });
    }

    function getFiltered(){
      const q = currentSearch.toLowerCase();
      const now = Date.now();
      return places.filter(p=>{
        if (currentFilter!=='all' && p.status!==currentFilter) return false;
        if (currentCat!=='all' && p.category.toLowerCase()!==currentCat.toLowerCase()) return false;
        if (currentManager!=='all' && (p.manager||'').toLowerCase()!==currentManager.toLowerCase()) return false;
        if (q && !p.name.toLowerCase().includes(q) && !(p.address||'').toLowerCase().includes(q)) return false;
        if (filterPhone && !p.phone) return false;
        if (filterNotes && !p.notes) return false;
        if (filterOld && p.update) {
          const d = new Date(p.update).getTime();
          if (now - d < 30*24*60*60*1000) return false;
        }
        return true;
      });
    }
    function updateStats(){const f=getFiltered();document.getElementById('stats').textContent=`Показано: ${f.length} · На карте: ${f.filter(p=>p.lat&&p.lng).length}`}
    function renderList(){
      const list=document.getElementById('places-list');
      const f=getFiltered();
      list.innerHTML=f.map(p=>`
        <div class="place-item" data-id="${p.id}">
          <div class="name"><span class="status-dot ${p.status}"></span>${escapeHtml(p.name)}</div>
          <div class="meta">${p.category||''}${p.manager?' · '+escapeHtml(p.manager):''}</div>
        </div>`).join('');
      list.querySelectorAll('.place-item').forEach(el=>{
        el.addEventListener('click',()=>{
          currentPlace=places.find(x=>x.id===el.dataset.id);
          if(currentPlace&&currentPlace.lat&&currentPlace.lng)map.setView([currentPlace.lat,currentPlace.lng],16);
          if(currentPlace){
            document.getElementById('statusTitle').textContent=currentPlace.name;
            document.getElementById('new-status').value=currentPlace.status;
            document.getElementById('edit-manager').value=currentPlace.manager||'';
            document.getElementById('edit-phone').value=currentPlace.phone||'';
            document.getElementById('edit-notes').value=currentPlace.notes||'';
            document.getElementById('statusModal').classList.add('show');
          }
        });
      });
    }
    function refreshMarkers(){
      markerCluster.clearLayers();
      getFiltered().forEach(p=>{
        if(!p.lat||!p.lng)return;
        const icon = (p.status === 'working' && p.manager)
          ? L.divIcon({
              className: '',
              html: `<div style="background:${getManagerColor(p.manager)};width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>`,
              iconSize: [22,22],
              iconAnchor: [11,11]
            })
          : L.divIcon({
              className: '',
              html: `<div style="background:${p.status==='not'?'#ef4444':p.status==='potential'?'#eab308':'#9ca3af'};width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
              iconSize: [18,18],
              iconAnchor: [9,9]
            });
        const yandexRoute = `https://yandex.ru/maps/?rtext=~${p.lat},${p.lng}&rtt=auto`;
        const callBtn = p.phone ? `<a href="tel:${p.phone}" style="display:inline-block;margin:4px 4px 0 0;padding:4px 10px;background:#22c55e;color:#fff;border-radius:4px;text-decoration:none;font-size:12px">📞 Позвонить</a>` : '';
        const routeBtn = `<a href="${yandexRoute}" target="_blank" style="display:inline-block;margin:4px 4px 0 0;padding:4px 10px;background:#3b82f6;color:#fff;border-radius:4px;text-decoration:none;font-size:12px">🗺 Маршрут</a>`;
        const popupHtml = `
          <b>${escapeHtml(p.name)}</b><br>
          ${p.category||''}<br>
          Статус: <b>${p.status}</b><br>
          Менеджер: ${escapeHtml(p.manager||'—')}<br>
          ${p.phone||''}<br>
          ${p.notes||''}<br>
          <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">
            <button onclick="quickStatus('${escapeHtml(p.name)}','working')" style="padding:4px 8px;font-size:11px;background:#22c55e;color:#fff;border:none;border-radius:4px">Работаю</button>
            <button onclick="quickStatus('${escapeHtml(p.name)}','not')" style="padding:4px 8px;font-size:11px;background:#ef4444;color:#fff;border:none;border-radius:4px">Не работаю</button>
            <button onclick="quickStatus('${escapeHtml(p.name)}','potential')" style="padding:4px 8px;font-size:11px;background:#eab308;color:#000;border:none;border-radius:4px">Потенциал</button>
            <button onclick="quickStatus('${escapeHtml(p.name)}','unknown')" style="padding:4px 8px;font-size:11px;background:#9ca3af;color:#fff;border:none;border-radius:4px">Неизвестно</button>
          </div>
          <div style="margin-top:6px">${callBtn}${routeBtn}</div>
        `;
        const m = L.marker([p.lat, p.lng], {icon})
          .bindTooltip(popupHtml, {direction: 'top', offset: [0, -10], opacity: 0.95})
          .bindPopup(popupHtml);
        m.on('click',()=>{
          currentPlace=p;
          document.getElementById('statusTitle').textContent=p.name;
          document.getElementById('new-status').value=p.status;
          document.getElementById('edit-manager').value=p.manager||'';
          document.getElementById('edit-phone').value=p.phone||'';
          document.getElementById('edit-notes').value=p.notes||'';
          document.getElementById('statusModal').classList.add('show');
        });
        markerCluster.addLayer(m);
      });
    }

    async function geocode(address){
      try{
        // Яндекс Геокодер (нужен ключ — замени YOUR_YANDEX_KEY)
        const key = 'YOUR_YANDEX_KEY';
        if (key && key !== 'YOUR_YANDEX_KEY') {
          const r = await fetch(`https://geocode-maps.yandex.ru/1.x/?apikey=${key}&format=json&geocode=${encodeURIComponent(address + ', Москва')}`);
          const d = await r.json();
          const pos = d.response.GeoObjectCollection.featureMember[0]?.GeoObject.Point.pos;
          if (pos) {
            const [lng, lat] = pos.split(' ').map(Number);
            return {lat, lng};
          }
        }
        // Fallback на Nominatim
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address+', Москва')}&limit=1`);
        const d = await r.json();
        if(d[0]) return {lat:parseFloat(d[0].lat), lng:parseFloat(d[0].lon)};
      }catch(e){}
      return {lat:'', lng:''};
    }

    // Клик по карте — поставить точку
    let pendingMarker = null;
    map.on('click', async function(e) {
      if (pendingMarker) map.removeLayer(pendingMarker);
      pendingMarker = L.marker(e.latlng, {draggable: true}).addTo(map);
      const modal = document.getElementById('addModal');
      modal.classList.add('show');
      modal.dataset.lat = e.latlng.lat;
      modal.dataset.lng = e.latlng.lng;
      // Обратный геокодинг — подтянуть адрес
      try {
        const key = 'YOUR_YANDEX_KEY';
        let addr = '';
        if (key && key !== 'YOUR_YANDEX_KEY') {
          const r = await fetch(`https://geocode-maps.yandex.ru/1.x/?apikey=${key}&format=json&geocode=${e.latlng.lng},${e.latlng.lat}`);
          const d = await r.json();
          addr = d.response.GeoObjectCollection.featureMember[0]?.GeoObject.metaDataProperty.GeocoderMetaData.text || '';
        }
        if (!addr) {
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}&zoom=18&addressdetails=1`);
          const d = await r.json();
          addr = d.display_name || '';
        }
        if (addr) document.getElementById('add-address').value = addr;
      } catch (err) {}
    });
    document.getElementById('cancelAdd').onclick=()=>{
      document.getElementById('addModal').classList.remove('show');
      if(pendingMarker){map.removeLayer(pendingMarker);pendingMarker=null;}
    };
    document.getElementById('saveAdd').onclick=async()=>{
      const name=document.getElementById('add-name').value.trim();
      const company=document.getElementById('add-company').value.trim();
      const address=document.getElementById('add-address').value.trim();
      const manager=document.getElementById('add-manager').value.trim();
      const phone=document.getElementById('add-phone').value.trim();
      const notes=document.getElementById('add-notes').value.trim();
      const category=document.getElementById('add-category').value;
      const status=document.getElementById('add-status').value;
      if(!name)return alert('Введите название');
      const modal=document.getElementById('addModal');
      let lat=modal.dataset.lat||'';
      let lng=modal.dataset.lng||'';
      if(!lat||!lng){
        if(address){
          const coords=await geocode(address);
          lat=coords.lat;lng=coords.lng;
        }
      }
      await fetch(SCRIPT_URL,{
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'add',name,company,address,manager,phone,notes,category,status,lat,lng})
      });
      document.getElementById('addModal').classList.remove('show');
      if(pendingMarker){map.removeLayer(pendingMarker);pendingMarker=null;}
      setTimeout(loadFromSheet,1500);
    };

    async function quickStatus(name, status) {
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({action: 'status', name, status})
        });
        map.closePopup();
        setTimeout(loadFromSheet, 800);
      } catch (e) {
        alert('Не удалось сменить статус');
      }
    }

    document.getElementById('cancelStatus').onclick=()=>document.getElementById('statusModal').classList.remove('show');
    document.getElementById('saveStatus').onclick=async()=>{
      if(!currentPlace)return;
      const status=document.getElementById('new-status').value;
      const manager=document.getElementById('edit-manager').value.trim();
      const phone=document.getElementById('edit-phone').value.trim();
      const notes=document.getElementById('edit-notes').value.trim();
      const btn = document.getElementById('saveStatus');
      btn.disabled = true;
      btn.textContent = 'Сохранение...';
      try {
        const resp = await fetch(SCRIPT_URL,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({action:'status',name:currentPlace.name,status,manager,phone,notes})
        });
        document.getElementById('statusModal').classList.remove('show');
        setTimeout(loadFromSheet,1500);
      } catch(e) {
        alert('Ошибка сохранения. Проверьте Apps Script.');
        console.error(e);
      }
      btn.disabled = false;
      btn.textContent = 'Сохранить';
    };
    document.getElementById('deleteBtn').onclick=async()=>{
      if(!currentPlace)return;
      if(!confirm(`Точно удалить «${currentPlace.name}»?`))return;
      const btn = document.getElementById('deleteBtn');
      btn.disabled = true;
      btn.textContent = 'Удаление...';
      try {
        await fetch(SCRIPT_URL,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({action:'delete',name:currentPlace.name})
        });
        document.getElementById('statusModal').classList.remove('show');
        setTimeout(loadFromSheet,1500);
      } catch(e) {
        alert('Ошибка удаления.');
        console.error(e);
      }
      btn.disabled = false;
      btn.textContent = 'Удалить';
    };

    document.querySelectorAll('.filters .filter-btn').forEach(btn=>btn.onclick=()=>{
      currentFilter=btn.dataset.filter;
      document.querySelectorAll('.filters .filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');refreshMarkers();renderList();updateStats();
    });
    document.querySelectorAll('#catFilters .filter-btn').forEach(btn=>btn.onclick=()=>{
      currentCat=btn.dataset.cat;
      document.querySelectorAll('#catFilters .filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');refreshMarkers();renderList();updateStats();
    });
    document.getElementById('filterPhone').onchange = e => { filterPhone = e.target.checked; refreshMarkers(); renderList(); updateStats(); };
    document.getElementById('filterNotes').onchange = e => { filterNotes = e.target.checked; refreshMarkers(); renderList(); updateStats(); };
    document.getElementById('filterOld').onchange = e => { filterOld = e.target.checked; refreshMarkers(); renderList(); updateStats(); };
    document.getElementById('toggleCluster').onchange = e => {
      clustersOn = e.target.checked;
      if (clustersOn) map.addLayer(markerCluster);
      else map.removeLayer(markerCluster);
      refreshMarkers();
    };
    document.getElementById('themeBtn').onclick = () => {
      const body = document.body;
      if (body.classList.contains('light')) {
        body.classList.remove('light');
        body.classList.add('sepia');
      } else if (body.classList.contains('sepia')) {
        body.classList.remove('sepia');
        body.classList.add('dim');
      } else if (body.classList.contains('dim')) {
        body.classList.remove('dim');
      } else {
        body.classList.add('light');
      }
    };
    document.getElementById('searchInput').oninput = () => {
      currentSearch = document.getElementById('searchInput').value.trim();
      refreshMarkers();renderList();updateStats();
    };
    document.getElementById('managerFilter').onchange=()=>{
      currentManager=document.getElementById('managerFilter').value;
      refreshMarkers();renderList();updateStats();
    };
    document.getElementById('exportKmlBtn').onclick = () => {
      const f = getFiltered();
      let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
<name>Моя карта</name>`;
      f.forEach(p => {
        if (!p.lat || !p.lng) return;
        kml += `
<Placemark>
  <name>${escapeHtml(p.name)}</name>
  <description>${escapeHtml(p.category||'')} | ${p.status} | ${escapeHtml(p.manager||'')}</description>
  <Point><coordinates>${p.lng},${p.lat},0</coordinates></Point>
</Placemark>`;
      });
      kml += `</Document></kml>`;
      const blob = new Blob([kml], {type: 'application/vnd.google-earth.kml+xml'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'karta.kml';
      a.click();
    };
    document.getElementById('exportBtn').onclick=()=>{
      const f=getFiltered();
      const csv=['Название,ООО,Менеджер,Категория,Status,Телефон,Заметки,Адрес,lat,lng'];
      f.forEach(p=>csv.push(`"${p.name}","${p.company||''}","${p.manager||''}","${p.category||''}","${p.status}","${p.phone||''}","${(p.notes||'').replace(/"/g,'""')}","${p.address||''}",${p.lat||''},${p.lng||''}`));
      const blob=new Blob([csv.join('\n')],{type:'text/csv'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='places.csv';a.click();
    };

    document.getElementById('filtersBtn').onclick = () => {
      const p = document.getElementById('filtersPanel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('toggleSidebar').onclick = () => {
      document.getElementById('sidebar').classList.toggle('open');
    };

    // Кнопка Добавить
    document.getElementById('addBtn').onclick = () => {
      document.getElementById('addModal').classList.add('show');
      document.getElementById('addModal').dataset.lat = '';
      document.getElementById('addModal').dataset.lng = '';
    };

    loadFromSheet();
    setInterval(loadFromSheet, 30000);
  </script>
</body>
</html>
